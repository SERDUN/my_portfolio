name: my_portfolio
description: Serdun Dmitro
version: 1.0.0+3
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  data:
    path: ./package/data
  domain:
    path: ./package/domain

  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  freezed: ^4.0.3
  google_fonts: ^9.0.0
  go_router: ^18.1.1
  responsive_framework: ^1.1.0
  octo_image: ^2.1.2
  url_launcher: ^6.1.14
  intl: ^0.20.3
  ionicons: ^0.2.2
  flutter_blurhash: ^0.9.1

  material_ui: ^1.8.0
  cupertino_icons: ^2.0.0
dev_dependencies:
  build_runner: ^2.15.0
  injectable_generator: ^3.1.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/image/icons/
    - assets/image/language/

flutter_gen:
  output: lib/app/
  integrations:
    flutter_svg: true
    flare_flutter: true
