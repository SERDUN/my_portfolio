name: data
description: Data sources, DTO mappers and repository implementations of the portfolio, plus the bundled JSON content. Pure Dart, no Flutter.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.0

# Must never declare `flutter`: the Jaspr presenter reads the content through
# this package and compiles to JavaScript. Reading a bundled file goes through
# AssetLoader, which each presenter implements. tool/scripts/layer-deps-check.sh
# enforces it.
dependencies:
  contract:
    path: ../contract
  domain:
    path: ../domain

  http: ^1.1.0
  injectable: ^3.0.0
  get_it: ^9.3.0

dev_dependencies:
  build_runner: ^2.15.0
  injectable_generator: ^3.1.3
  lints: ^6.0.0
  test: ^1.25.0

# Read by the Flutter tool, not by pub: it bundles these files into the app
# under `packages/data/`. The Jaspr pre-render reads them from disk.
flutter:
  assets:
    - assets/data/en/
    - assets/data/uk/
